server:
  port: 8081

spring:
  application:
    name: record-provider
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aug_platform}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
    hikari:
      # 双保险：Provider 只读，禁止写入
      read-only: true
      maximum-pool-size: 10
      connection-timeout: 5000
  jackson:
    time-zone: UTC

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

dubbo:
  application:
    name: record-provider
    qos-enable: false
  registry:
    address: zookeeper://${ZK_HOST:127.0.0.1}:${ZK_PORT:2181}
    # Dubbo 2.x 兼容铁律：接口级 + 应用级双注册
    register-mode: all
  protocol:
    name: dubbo
    serialization: hessian2
    port: 20880
    # 刻意不设置 host：Dubbo 3.2 会自动探测本机 IP。
    # 若 Provider 注册到不可达虚拟网卡（症状：Consumer 全量 500 且 Provider 无请求日志），
    # 用非 loopback 真实网卡 IP 重启：export DUBBO_IP_TO_REGISTRY=<真实网卡IP>
  metadata-report:
    address: zookeeper://${ZK_HOST:127.0.0.1}:${ZK_PORT:2181}

logging:
  level:
    com.aug.record: INFO
